name: Finalize PanFamFlow v0.1.1 resume branch

on:
  push:
    branches:
      - feature/panfamflow-v0.1.1-resume
    paths:
      - ".github/workflows/panfamflow-v0.1.1-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: panfamflow-v0.1.1-finalize
  cancel-in-progress: false

jobs:
  verify-publish-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARCHIVE_FILE_ID: "1p0HUZHr2ckfJB1kwPob_ir2ho46SwIki"
      ARCHIVE_SHA256: "c4d685c5d0c7aa349af2aa1b07ef566f05fbf5d0ae461afe664212dc3af9cbca"
      FEATURE_BRANCH: "feature/panfamflow-v0.1.1-resume"

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Materialize verified archive only when project is absent
        run: |
          set -euo pipefail
          if [[ -f PanFamFlow/pyproject.toml ]]; then
            echo "PanFamFlow source is already materialized; preserving it for re-verification."
            exit 0
          fi

          python3 - <<'PY'
          import hashlib
          import os
          import stat
          import urllib.request
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          root = Path.cwd().resolve()
          file_id = os.environ["ARCHIVE_FILE_ID"]
          expected = os.environ["ARCHIVE_SHA256"]
          destination = Path("/tmp/PanFamFlow-v0.1.1-staging.zip")
          urls = [
              f"https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t",
              f"https://drive.google.com/uc?export=download&id={file_id}&confirm=t",
          ]

          failures: list[str] = []
          for url in urls:
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "PanFamFlow-finalizer/0.1.1"},
                  )
                  with urllib.request.urlopen(request, timeout=120) as response:
                      payload = response.read()
                  observed = hashlib.sha256(payload).hexdigest()
                  if observed == expected:
                      destination.write_bytes(payload)
                      print(f"Verified archive: {destination} ({len(payload)} bytes)")
                      break
                  failures.append(
                      f"{url}: sha256={observed}, bytes={len(payload)}, prefix={payload[:32]!r}"
                  )
              except Exception as exc:  # noqa: BLE001
                  failures.append(f"{url}: {type(exc).__name__}: {exc}")
          else:
              raise RuntimeError("Unable to retrieve verified archive:\n" + "\n".join(failures))

          project = root / "PanFamFlow"
          if project.exists():
              raise RuntimeError(f"Refusing to overwrite existing path: {project}")

          with ZipFile(destination) as handle:
              corrupt = handle.testzip()
              if corrupt is not None:
                  raise RuntimeError(f"Corrupt ZIP member: {corrupt}")
              for member in handle.infolist():
                  logical = PurePosixPath(member.filename)
                  if logical.is_absolute() or ".." in logical.parts:
                      raise RuntimeError(f"Unsafe archive path: {member.filename}")
                  unix_mode = member.external_attr >> 16
                  if stat.S_ISLNK(unix_mode):
                      raise RuntimeError(f"Archive symlink is not allowed: {member.filename}")
                  target = (root / member.filename).resolve()
                  if not target.is_relative_to(root):
                      raise RuntimeError(f"Archive member escapes repository: {member.filename}")
              handle.extractall(root)

          required = [
              project / "pyproject.toml",
              project / "src" / "panfamflow" / "cli.py",
              project / "src" / "panfamflow" / "runner.py",
              project / "src" / "panfamflow" / "workflow" / "Snakefile",
              project / "tests",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise RuntimeError(f"Archive is incomplete; missing: {missing}")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "PanFamFlow/uv.lock"

      - name: Resolve locked Python environment
        working-directory: PanFamFlow
        run: |
          set -euo pipefail
          uv python install 3.12
          uv lock
          uv sync --locked --dev

      - name: Format, lint, type-check and test
        working-directory: PanFamFlow
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/panfamflow
          uv run pytest -q
          uv build

      - name: Validate CLI and resume surface
        working-directory: PanFamFlow
        run: |
          set -euo pipefail
          uv run panfamflow --version
          uv run panfamflow validate -c examples/toy/config.yaml -m qc
          uv run panfamflow plan -c examples/toy/config.yaml -m qc
          uv run panfamflow status -c examples/toy/config.yaml -m qc
          uv run pytest -q tests/test_runner.py tests/test_workflow_utils.py

      - name: Validate Snakemake DAG
        working-directory: PanFamFlow
        run: |
          set -euo pipefail
          uv run --with 'snakemake==9.25.1' snakemake \
            --snakefile "${GITHUB_WORKSPACE}/PanFamFlow/src/panfamflow/workflow/Snakefile" \
            --configfile "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy/config.yaml" \
            --directory "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy" \
            --lint
          uv run --with 'snakemake==9.25.1' snakemake \
            --snakefile "${GITHUB_WORKSPACE}/PanFamFlow/src/panfamflow/workflow/Snakefile" \
            --configfile "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy/config.yaml" \
            --directory "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy" \
            --cores 2 \
            --dry-run \
            results/00_qc/qc.done

      - name: Commit and push verified source before cleanup
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PanFamFlow
          if ! git diff --cached --quiet; then
            git commit -m "feat: add PanFamFlow v0.1.1 smart resume"
            git push origin "HEAD:${FEATURE_BRANCH}"
          else
            echo "Verified source already committed."
          fi

      - name: Install long-lived CI and remove one-time staging
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/panfamflow-ci.yml <<'YAML'
          name: PanFamFlow CI

          on:
            pull_request:
              paths:
                - "PanFamFlow/**"
                - ".github/workflows/panfamflow-ci.yml"
            push:
              branches:
                - main
                - feature/panfamflow-v0.1.1-resume
              paths:
                - "PanFamFlow/**"
                - ".github/workflows/panfamflow-ci.yml"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            quality-and-dag:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              defaults:
                run:
                  working-directory: PanFamFlow
              steps:
                - name: Checkout
                  uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

                - name: Install uv
                  uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
                  with:
                    version: "0.12.3"
                    enable-cache: true
                    cache-dependency-glob: "PanFamFlow/uv.lock"

                - name: Sync locked environment
                  run: |
                    uv python install 3.12
                    uv sync --locked --dev

                - name: Static and unit checks
                  run: |
                    uv run ruff check .
                    uv run ruff format --check .
                    uv run mypy src/panfamflow
                    uv run pytest -q
                    uv build

                - name: CLI and smart-resume checks
                  run: |
                    uv run panfamflow --version
                    uv run panfamflow validate -c examples/toy/config.yaml -m qc
                    uv run panfamflow plan -c examples/toy/config.yaml -m qc
                    uv run panfamflow status -c examples/toy/config.yaml -m qc
                    uv run pytest -q tests/test_runner.py tests/test_workflow_utils.py

                - name: Snakemake lint and toy dry-run
                  run: |
                    uv run --with 'snakemake==9.25.1' snakemake \
                      --snakefile "${GITHUB_WORKSPACE}/PanFamFlow/src/panfamflow/workflow/Snakefile" \
                      --configfile "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy/config.yaml" \
                      --directory "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy" \
                      --lint
                    uv run --with 'snakemake==9.25.1' snakemake \
                      --snakefile "${GITHUB_WORKSPACE}/PanFamFlow/src/panfamflow/workflow/Snakefile" \
                      --configfile "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy/config.yaml" \
                      --directory "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy" \
                      --cores 2 \
                      --dry-run \
                      results/00_qc/qc.done
          YAML

          rm -rf _panfamflow_staging
          rm -f .github/workflows/panfamflow-v0.1.1-bootstrap.yml
          rm -f .github/workflows/panfamflow-v0.1.1-finalize.yml

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: finalize PanFamFlow v0.1.1 branch"
            git push origin "HEAD:${FEATURE_BRANCH}"
          fi

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh pr view --head "${FEATURE_BRANCH}" >/dev/null 2>&1; then
            echo "Pull request already exists."
          else
            gh pr create \
              --base main \
              --head "${FEATURE_BRANCH}" \
              --title "feat: PanFamFlow v0.1.1 smart resume" \
              --body "Adds resumable, configuration-driven gene-family analysis. Completed valid jobs are skipped; incomplete or outdated jobs are rerun; IQ-TREE, OrthoFinder and Ka/Ks retain recoverable state. This PR supersedes the incomplete v0.1.0 staging PR."
          fi

      - name: Explicitly dispatch long-lived CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/panfamflow-ci.yml/dispatches" \
              -f ref="${FEATURE_BRANCH}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Long-lived CI dispatch failed after source publication." >&2
          exit 1
