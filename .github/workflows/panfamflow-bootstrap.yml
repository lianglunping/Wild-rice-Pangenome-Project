name: Bootstrap PanFamFlow feature branch

on:
  push:
    branches:
      - feature/panfamflow-v0.1.0
    paths:
      - "_staging/**"
      - ".github/workflows/panfamflow-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract staged project safely
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          root = Path.cwd().resolve()
          archive = Path("/tmp/panfamflow-staging.zip")
          parts = sorted((root / "_staging").glob("part-*"))
          if not parts:
              raise RuntimeError("No staging parts were found")

          encoded = "".join(
              "".join(part.read_text(encoding="ascii").split())
              for part in parts
          )

          # The staged payload contains multiple independently Base64-encoded
          # binary chunks. Padding can occur inside the concatenated text, so a
          # single strict b64decode reports `Excess data after padding`. Split
          # only after a complete padding run, then decode and concatenate the
          # binary streams in file order.
          streams: list[str] = []
          start = 0
          index = 0
          while index < len(encoded):
              if encoded[index] != "=":
                  index += 1
                  continue
              end = index
              while end + 1 < len(encoded) and encoded[end + 1] == "=":
                  end += 1
              streams.append(encoded[start : end + 1])
              start = end + 1
              index = end + 1
          if start < len(encoded):
              streams.append(encoded[start:])

          decoded_parts: list[bytes] = []
          for stream_number, stream in enumerate(streams, start=1):
              if len(stream) % 4:
                  stream += "=" * (-len(stream) % 4)
              try:
                  decoded_parts.append(base64.b64decode(stream, validate=True))
              except ValueError as error:
                  raise RuntimeError(
                      f"Invalid Base64 stream {stream_number} with length {len(stream)}"
                  ) from error

          payload = b"".join(decoded_parts)
          # Hash of the deterministically reconstructed binary payload stored in
          # `_staging/part-*`. Archive members are also CRC-tested below before
          # extraction, so neither an incomplete nor corrupt archive is accepted.
          expected_sha256 = "8fd66b2de051dedf0991a244b3d7957e27c32e08865b7050a584faa6134d0d38"
          actual_sha256 = hashlib.sha256(payload).hexdigest()
          if actual_sha256 != expected_sha256:
              raise RuntimeError(
                  "Staging archive SHA256 mismatch: "
                  f"{actual_sha256} != {expected_sha256}; "
                  f"decoded_streams={len(streams)}"
              )

          archive.write_bytes(payload)
          with ZipFile(archive) as handle:
              corrupt_member = handle.testzip()
              if corrupt_member is not None:
                  raise RuntimeError(f"Corrupt ZIP member: {corrupt_member}")
              for member in handle.infolist():
                  target = (root / member.filename).resolve()
                  if not target.is_relative_to(root):
                      raise RuntimeError(f"Unsafe archive member: {member.filename}")
              handle.extractall(root)
          PY
          rm -rf _staging
          rm -f .github/workflows/panfamflow-bootstrap.yml

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "PanFamFlow/uv.lock"

      - name: Install Python and resolve lockfile
        working-directory: PanFamFlow
        run: |
          uv python install 3.12
          uv lock
          uv sync --locked --dev

      - name: Format and lint
        working-directory: PanFamFlow
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check and unit tests
        working-directory: PanFamFlow
        run: |
          uv run mypy src/panfamflow
          uv run pytest -q

      - name: Build package
        working-directory: PanFamFlow
        run: uv build

      - name: Validate CLI and Snakemake DAG
        working-directory: PanFamFlow
        run: |
          uv run panfamflow validate -c examples/toy/config.yaml -m qc
          uv run --with 'snakemake==9.25.1' snakemake \
            --snakefile "${GITHUB_WORKSPACE}/PanFamFlow/src/panfamflow/workflow/Snakefile" \
            --configfile "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy/config.yaml" \
            --directory "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy" \
            --cores 2 \
            --dry-run \
            results/00_qc/qc.done

      - name: Upload verified source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: panfamflow-v0.1.0-verified-source
          path: PanFamFlow
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified project
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add PanFamFlow v0.1.0-alpha"
          git push origin "HEAD:${GITHUB_REF_NAME}"
