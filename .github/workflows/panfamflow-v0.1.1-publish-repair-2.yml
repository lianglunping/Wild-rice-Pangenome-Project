name: Final repair and publish PanFamFlow v0.1.1

on:
  push:
    branches:
      - feature/panfamflow-v0.1.1-resume
    paths:
      - ".github/workflows/panfamflow-v0.1.1-publish-repair-2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panfamflow-v0.1.1-final-publication
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Reconstruct checksum-verified source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import lzma
          import shutil
          import stat
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          staging = root / "_panfamflow_publish"
          parts = sorted(staging.glob("chunk-*"))
          expected_names = [f"chunk-{index:03d}" for index in range(10)]
          observed_names = [part.name for part in parts]
          if observed_names != expected_names:
              raise RuntimeError(
                  f"Publication chunks are incomplete or unordered: {observed_names}"
              )

          encoded = "".join(
              "".join(part.read_text(encoding="ascii").split()) for part in parts
          )
          if len(encoded) % 4:
              raise RuntimeError(f"Invalid concatenated Base64 length: {len(encoded)}")
          payload = base64.b64decode(encoded, validate=True)

          expected_xz = "83541dc11b867f1de7ec0c4a4889f7ef16f9f29e3fecdd6517d37c736c968c39"
          observed_xz = hashlib.sha256(payload).hexdigest()
          if observed_xz != expected_xz:
              raise RuntimeError(f"XZ SHA256 mismatch: {observed_xz} != {expected_xz}")
          if not payload.startswith(b"\xfd7zXZ\x00"):
              raise RuntimeError("Publication payload is not XZ data")

          tar_bytes = lzma.decompress(payload)
          expected_tar = "4e232479ab297d969c0174fa45ab1e4211b437f1d5323d9af9ed2b2566470b66"
          observed_tar = hashlib.sha256(tar_bytes).hexdigest()
          if observed_tar != expected_tar:
              raise RuntimeError(f"TAR SHA256 mismatch: {observed_tar} != {expected_tar}")

          project = root / "PanFamFlow"
          if project.exists():
              shutil.rmtree(project)

          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:") as handle:
              members = handle.getmembers()
              if not members:
                  raise RuntimeError("Publication archive is empty")
              for member in members:
                  logical = PurePosixPath(member.name)
                  if logical.is_absolute() or ".." in logical.parts:
                      raise RuntimeError(f"Unsafe archive path: {member.name}")
                  if not logical.parts or logical.parts[0] != "PanFamFlow":
                      raise RuntimeError(f"Member outside PanFamFlow/: {member.name}")
                  if member.issym() or member.islnk() or stat.S_ISLNK(member.mode):
                      raise RuntimeError(f"Links are not allowed: {member.name}")
                  target = (root / member.name).resolve()
                  if not target.is_relative_to(root):
                      raise RuntimeError(f"Archive member escapes repository: {member.name}")
              handle.extractall(root)

          required = [
              project / "README.md",
              project / "pyproject.toml",
              project / "uv.lock",
              project / "docs" / "SCOPE.md",
              project / "docs" / "AUDIT.md",
              project / "docs" / "RESUME.md",
              project / "src" / "panfamflow" / "cli.py",
              project / "src" / "panfamflow" / "config.py",
              project / "src" / "panfamflow" / "runner.py",
              project / "src" / "panfamflow" / "workflow" / "Snakefile",
              project / "src" / "panfamflow" / "workflow" / "rules" / "pan_family.smk",
              project / "src" / "panfamflow" / "templates" / "config.yaml",
              project / "tests" / "test_config.py",
              project / "tests" / "test_runner.py",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise RuntimeError(f"Source archive is incomplete: {missing}")

          readme = (project / "README.md").read_text(encoding="utf-8")
          if not readme.startswith("# PanFamFlow — 泛基因家族分析流程"):
              raise RuntimeError("README title is not pan-gene-family specific")
          if "不是泛基因组组装流程" not in readme:
              raise RuntimeError("README does not exclude pangenome assembly")

          template = (project / "src/panfamflow/templates/config.yaml").read_text(
              encoding="utf-8"
          )
          if "\npan_family:\n" not in template or "\npangenome:\n" in template:
              raise RuntimeError("Canonical config is not restricted to pan_family")
          if "analysis_scope: target_pan_gene_family" not in template:
              raise RuntimeError("Canonical config does not freeze target-family scope")

          print(
              f"Verified archive: XZ={observed_xz}; TAR={observed_tar}; "
              f"members={len(members)}"
          )
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "PanFamFlow/pyproject.toml"

      - name: Refresh lockfile and sync environment
        working-directory: PanFamFlow
        run: |
          set -euo pipefail
          uv python install 3.12
          uv lock
          uv sync --locked --all-extras --dev

      - name: Apply deterministic code-format repairs
        working-directory: PanFamFlow
        run: |
          set -euo pipefail
          # The archived source predates the current Ruff rule set. Apply all
          # deterministic safe/unsafe transformations, then handle the one
          # deliberately managed file-handle pattern with a narrow noqa.
          uv run ruff check --fix --unsafe-fixes . || true
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/panfamflow/workflow/scripts/workflow_utils.py")
          text = path.read_text(encoding="utf-8")
          lines: list[str] = []
          for line in text.splitlines():
              if (
                  "_handle = Path(" in line
                  and ").open(" in line
                  and "# noqa: SIM115" not in line
              ):
                  line = f"{line}  # noqa: SIM115"
              lines.append(line)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .

      - name: Type checks, tests and package build
        working-directory: PanFamFlow
        run: |
          set -euo pipefail
          uv run mypy src/panfamflow
          uv run pytest -q
          uv build

      - name: Scope, CLI and DAG checks
        working-directory: PanFamFlow
        run: |
          set -euo pipefail
          uv run panfamflow --version
          uv run panfamflow list-modules | tee /tmp/panfamflow-modules.txt
          grep -q 'pan_family' /tmp/panfamflow-modules.txt
          ! grep -qE '(^|[[:space:]])pangenome([[:space:]]|$)' /tmp/panfamflow-modules.txt
          uv run panfamflow validate -c examples/toy/config.yaml -m qc
          uv run panfamflow plan -c examples/toy/config.yaml -m pan_family
          uv run --with 'snakemake==9.25.1' snakemake \
            --snakefile "${GITHUB_WORKSPACE}/PanFamFlow/src/panfamflow/workflow/Snakefile" \
            --configfile "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy/config.yaml" \
            --directory "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy" \
            --cores 2 \
            --dry-run \
            results/00_qc/qc.done

      - name: Smart-resume integration test
        working-directory: PanFamFlow
        run: |
          set -euo pipefail
          rm -rf examples/toy/{results,work,logs,.snakemake,.panfamflow}
          run_qc() {
            uv run --with 'snakemake==9.25.1' panfamflow run \
              -c examples/toy/config.yaml -m qc
          }

          run_qc
          audit='examples/toy/results/00_qc/input_audit.tsv'
          done_file='examples/toy/results/00_qc/qc.done'
          test -s "$audit" && test -s "$done_file"
          audit_sha=$(sha256sum "$audit" | awk '{print $1}')
          audit_mtime=$(stat -c %Y "$audit")
          done_sha=$(sha256sum "$done_file" | awk '{print $1}')
          done_mtime=$(stat -c %Y "$done_file")

          sleep 1
          run_qc
          test "$audit_sha" = "$(sha256sum "$audit" | awk '{print $1}')"
          test "$audit_mtime" = "$(stat -c %Y "$audit")"
          test "$done_sha" = "$(sha256sum "$done_file" | awk '{print $1}')"
          test "$done_mtime" = "$(stat -c %Y "$done_file")"

          rm "$done_file"
          sleep 1
          run_qc
          test -s "$done_file"
          test "$audit_sha" = "$(sha256sum "$audit" | awk '{print $1}')"
          test "$audit_mtime" = "$(stat -c %Y "$audit")"

      - name: Upload verified source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panfamflow-v0.1.1-verified-source
          path: PanFamFlow
          if-no-files-found: error
          retention-days: 30

      - name: Install durable repository entry point
        run: |
          set -euo pipefail
          cat > README.md <<'MARKDOWN'
          # Wild rice Pangenome Project

          > **Feature-branch addition:** [`PanFamFlow/`](./PanFamFlow/) is a target **pan-gene-family analysis** workflow. It consumes already assembled and annotated genomes; it is not a genome-assembly or graph-pangenome construction pipeline.

          ## PanFamFlow: target pan-gene-family analysis

          PanFamFlow identifies one configured gene family across multiple assembled genomes or materials, then integrates family-member evidence, family phylogeny, target-family HOG occupancy, Core/Soft-core/Shell/Cloud classification, gene structure, chromosome distribution, duplication, Ka/Ks, promoter motifs, expression and a traceable report.

          It does **not** assemble genomes, construct graph pangenomes, call genome-wide SV/PAV, or classify every genome-wide HOG as a general pangenome product. Read the [workflow README](./PanFamFlow/README.md), [scope contract](./PanFamFlow/docs/SCOPE.md), [audit notes](./PanFamFlow/docs/AUDIT.md), [resume semantics](./PanFamFlow/docs/RESUME.md), and [validation status](./PanFamFlow/docs/VALIDATION.md).

          ## Original repository content

          The original Wild Rice Pangenome Project code remains available in directories 1–8. Original database: [RicePandb](http://ricepandb.ncgr.ac.cn). Original publication: Guo, D., Li, Y., Lu, H. et al. *A pangenome reference of wild and cultivated rice*. Nature (2025). https://doi.org/10.1038/s41586-025-08883-6.
          MARKDOWN

          # The durable CI uses the freshly committed lockfile and all optional
          # development dependencies. Keep it strict after this publication job.
          sed -i \
            's/uv sync --locked --dev/uv sync --locked --all-extras --dev/g' \
            .github/workflows/panfamflow-ci.yml

      - name: Commit verified source and remove temporary machinery
        run: |
          set -euo pipefail
          rm -rf _panfamflow_publish _panfamflow_staging
          rm -f .github/workflows/panfamflow-ci-attest.yml
          rm -f .github/workflows/panfamflow-v0.1.1-direct-materialize.yml
          rm -f .github/workflows/panfamflow-v0.1.1-finalize.yml
          rm -f .github/workflows/panfamflow-v0.1.1-publish-repair.yml
          rm -f .github/workflows/panfamflow-v0.1.1-publish-repair-2.yml

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish verified PanFamFlow target-family workflow"
          git push origin "HEAD:feature/panfamflow-v0.1.1-resume"
