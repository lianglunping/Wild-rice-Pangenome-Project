name: PanFamFlow CI attestation

on:
  workflow_run:
    workflows:
      - PanFamFlow CI
    types:
      - completed
    branches:
      - feature/panfamflow-v0.1.1-resume

permissions:
  contents: write

env:
  FEATURE_BRANCH: feature/panfamflow-v0.1.1-resume

jobs:
  attest-success:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0

      - name: Verify current branch still contains the validated source
        run: |
          set -euo pipefail
          validated_sha='${{ github.event.workflow_run.head_sha }}'
          current_sha=$(git rev-parse HEAD)
          test -f PanFamFlow/pyproject.toml
          test -f PanFamFlow/src/panfamflow/workflow/rules/pan_family.smk
          test -f PanFamFlow/docs/SCOPE.md
          test ! -e _panfamflow_publish
          test ! -e _panfamflow_staging
          for file in \
            .github/workflows/panfamflow-v0.1.1-bootstrap.yml \
            .github/workflows/panfamflow-v0.1.1-finalize.yml \
            .github/workflows/panfamflow-v0.1.1-recover.yml \
            .github/workflows/panfamflow-v0.1.1-direct-materialize.yml; do
            test ! -e "$file"
          done
          case "$current_sha" in
            "$validated_sha") ;;
            *)
              echo "Branch advanced after validation: validated=$validated_sha current=$current_sha" >&2
              exit 1
              ;;
          esac

      - name: Commit machine-readable validation attestation
        run: |
          set -euo pipefail
          mkdir -p PanFamFlow/docs
          cat > PanFamFlow/docs/CI_ATTESTATION.md <<EOF
          # PanFamFlow CI attestation

          - workflow: PanFamFlow CI
          - conclusion: success
          - validated_branch: ${FEATURE_BRANCH}
          - validated_commit: ${{ github.event.workflow_run.head_sha }}
          - workflow_run_id: ${{ github.event.workflow_run.id }}
          - workflow_run_url: ${{ github.event.workflow_run.html_url }}
          - generated_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          This attestation covers locked Python environment synchronization, static checks, unit tests, package build, scope checks, CLI/DAG checks, and the toy smart-resume integration test defined in `.github/workflows/panfamflow-ci.yml`.

          It does not establish biological validity on real rice data. The real-data benchmark described in `VALIDATION.md` remains required.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PanFamFlow/docs/CI_ATTESTATION.md
          git commit -m 'ci: record PanFamFlow validation attestation [skip ci]'
          git push origin "HEAD:${FEATURE_BRANCH}"
