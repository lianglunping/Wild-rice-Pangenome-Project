name: Fix Snakemake script compatibility and finalize PanFamFlow

on:
  push:
    branches:
      - feature/panfamflow-v0.1.1-resume
    paths:
      - ".github/workflows/panfamflow-v0.1.1-script-compat-finalizer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panfamflow-v0.1.1-script-compat-finalizer
  cancel-in-progress: false

jobs:
  patch-test-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: PanFamFlow

    steps:
      - name: Checkout materialized source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Patch Snakemake script compatibility and command boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script_dir = Path("src/panfamflow/workflow/scripts")
          changed_scripts: list[str] = []
          for path in sorted(script_dir.glob("*.py")):
              text = path.read_text(encoding="utf-8")
              future_line = "from __future__ import annotations\n"
              if future_line in text:
                  text = text.replace(future_line, "", 1)
                  path.write_text(text, encoding="utf-8")
                  changed_scripts.append(path.name)

          runner = Path("src/panfamflow/runner.py")
          runner_text = runner.read_text(encoding="utf-8")
          if 'command.append("--")' not in runner_text:
              old = '''    command.extend(config.run.extra_snakemake_args)\n    command.extend(targets)\n'''
              new = '''    command.extend(config.run.extra_snakemake_args)\n    # ``--rerun-triggers`` accepts multiple values. Without the standard\n    # option terminator, argparse can consume the first workflow target as\n    # another trigger. Delimit all positional targets explicitly.\n    command.append("--")\n    command.extend(targets)\n'''
              if old not in runner_text:
                  raise RuntimeError("Cannot locate Snakemake target append block")
              runner.write_text(runner_text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_runner.py")
          test_text = test_path.read_text(encoding="utf-8")
          if 'assert command[index + 2] == "--"' not in test_text:
              old_test = '''        assert command[index + 1] == "mtime"\n        assert command[index + 2].startswith("results/")\n'''
              new_test = '''        assert command[index + 1] == "mtime"\n        assert command[index + 2] == "--"\n        assert command[index + 3].startswith("results/")\n'''
              if old_test not in test_text:
                  raise RuntimeError("Cannot locate mtime-only target assertion")
              test_path.write_text(test_text.replace(old_test, new_test, 1), encoding="utf-8")

          if not changed_scripts:
              raise RuntimeError(
                  "No future imports were removed; expected unpatched Snakemake scripts"
              )
          print(f"Removed future import from {len(changed_scripts)} scripts")
          print("\n".join(changed_scripts))
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "PanFamFlow/pyproject.toml"

      - name: Refresh lockfile and sync full development environment
        run: |
          set -euo pipefail
          uv python install 3.12
          uv lock
          uv sync --locked --all-extras --dev

      - name: Static, unit and package gates
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/panfamflow
          uv run pytest -q
          uv build

      - name: Commit tested source compatibility fixes
        working-directory: .
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PanFamFlow
          git commit -m "fix: make Snakemake scripts executable and delimit targets"
          git push origin "HEAD:feature/panfamflow-v0.1.1-resume"

      - name: CLI, scope and DAG gates
        run: |
          set -euo pipefail
          uv run panfamflow --version
          uv run panfamflow list-modules | tee /tmp/panfamflow-modules.txt
          grep -q 'pan_family' /tmp/panfamflow-modules.txt
          ! grep -qE '(^|[[:space:]])pangenome([[:space:]]|$)' /tmp/panfamflow-modules.txt
          uv run panfamflow validate -c examples/toy/config.yaml -m qc
          uv run panfamflow plan -c examples/toy/config.yaml -m pan_family
          uv run --with 'snakemake==9.25.1' snakemake \
            --snakefile "${GITHUB_WORKSPACE}/PanFamFlow/src/panfamflow/workflow/Snakefile" \
            --configfile "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy/config.yaml" \
            --directory "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy" \
            --cores 2 \
            --dry-run \
            results/00_qc/qc.done

      - name: Execute first-run, skip and local-recovery regression
        run: |
          set -euo pipefail
          rm -rf examples/toy/{results,work,logs,.snakemake,.panfamflow}
          run_qc() {
            uv run --with 'snakemake==9.25.1' panfamflow run \
              -c examples/toy/config.yaml -m qc
          }

          run_qc
          audit='examples/toy/results/00_qc/input_audit.tsv'
          done_file='examples/toy/results/00_qc/qc.done'
          test -s "$audit" && test -s "$done_file"
          audit_sha=$(sha256sum "$audit" | awk '{print $1}')
          audit_mtime=$(stat -c %Y "$audit")
          done_sha=$(sha256sum "$done_file" | awk '{print $1}')
          done_mtime=$(stat -c %Y "$done_file")

          sleep 1
          run_qc
          test "$audit_sha" = "$(sha256sum "$audit" | awk '{print $1}')"
          test "$audit_mtime" = "$(stat -c %Y "$audit")"
          test "$done_sha" = "$(sha256sum "$done_file" | awk '{print $1}')"
          test "$done_mtime" = "$(stat -c %Y "$done_file")"

          rm "$done_file"
          sleep 1
          run_qc
          test -s "$done_file"
          test "$audit_sha" = "$(sha256sum "$audit" | awk '{print $1}')"
          test "$audit_mtime" = "$(stat -c %Y "$audit")"

          python3 - <<'PY'
          import json
          from pathlib import Path

          runs = sorted(Path("examples/toy/.panfamflow/provenance/runs").glob("*.json"))
          if len(runs) < 3:
              raise RuntimeError(f"Expected at least three provenance records, found {len(runs)}")
          latest = [json.loads(path.read_text(encoding="utf-8")) for path in runs[-3:]]
          statuses = [record.get("status") for record in latest]
          exits = [record.get("exit_code") for record in latest]
          if statuses != ["COMPLETED", "COMPLETED", "COMPLETED"] or exits != [0, 0, 0]:
              raise RuntimeError(f"Unexpected provenance terminal states: {statuses}, {exits}")
          print(f"Verified provenance records: {[record['run_id'] for record in latest]}")
          PY

      - name: Upload verified source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panfamflow-v0.1.1-verified-source
          path: PanFamFlow
          if-no-files-found: error
          retention-days: 30

      - name: Finalize repository presentation and durable CI
        working-directory: .
        run: |
          set -euo pipefail
          cat > README.md <<'MARKDOWN'
          # Wild rice Pangenome Project

          > **Feature-branch addition:** [`PanFamFlow/`](./PanFamFlow/) is a target **pan-gene-family analysis** workflow. It consumes already assembled and annotated genomes; it is not a genome-assembly or graph-pangenome construction pipeline.

          ## PanFamFlow: target pan-gene-family analysis

          PanFamFlow identifies one configured gene family across multiple assembled genomes or materials, then integrates family-member evidence, family phylogeny, target-family HOG occupancy, Core/Soft-core/Shell/Cloud classification, gene structure, chromosome distribution, duplication, Ka/Ks, promoter motifs, expression and a traceable report.

          It does **not** assemble genomes, construct graph pangenomes, call genome-wide SV/PAV, or classify every genome-wide HOG as a general pangenome product. Read the [workflow README](./PanFamFlow/README.md), [scope contract](./PanFamFlow/docs/SCOPE.md), [audit notes](./PanFamFlow/docs/AUDIT.md), [resume semantics](./PanFamFlow/docs/RESUME.md), and [validation status](./PanFamFlow/docs/VALIDATION.md).

          ## Original repository content

          The original Wild Rice Pangenome Project code remains available in directories 1–8. Original database: [RicePandb](http://ricepandb.ncgr.ac.cn). Original publication: Guo, D., Li, Y., Lu, H. et al. *A pangenome reference of wild and cultivated rice*. Nature (2025). https://doi.org/10.1038/s41586-025-08883-6.
          MARKDOWN

          sed -i \
            's/uv sync --locked --dev/uv sync --locked --all-extras --dev/g' \
            .github/workflows/panfamflow-ci.yml

          rm -rf _panfamflow_publish _panfamflow_staging
          rm -f .github/workflows/panfamflow-ci-attest.yml
          rm -f .github/workflows/panfamflow-v0.1.1-direct-materialize.yml
          rm -f .github/workflows/panfamflow-v0.1.1-finalize.yml
          rm -f .github/workflows/panfamflow-v0.1.1-publish-repair.yml
          rm -f .github/workflows/panfamflow-v0.1.1-publish-repair-2.yml
          rm -f .github/workflows/panfamflow-v0.1.1-publish-repair-3.yml
          rm -f .github/workflows/panfamflow-v0.1.1-source-finalizer.yml
          rm -f .github/workflows/panfamflow-v0.1.1-command-finalizer.yml
          rm -f .github/workflows/panfamflow-v0.1.1-script-compat-finalizer.yml

          git diff --check
          git add -A
          git commit -m "feat: finalize verified PanFamFlow target-family workflow"
          git push origin "HEAD:feature/panfamflow-v0.1.1-resume"
