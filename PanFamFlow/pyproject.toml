[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "panfamflow"
version = "0.1.0"
description = "Config-driven Snakemake workflow for gene-family, pangenome, evolution, promoter and expression analyses."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Evan / Lianglunping" }
]
keywords = [
  "bioinformatics",
  "gene-family",
  "pangenome",
  "orthofinder",
  "snakemake",
  "plant-genomics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
panfamflow = "panfamflow.cli:app"

[project.urls]
Repository = "https://github.com/lianglunping/Wild-rice-Pangenome-Project/tree/main/PanFamFlow"
Issues = "https://github.com/lianglunping/Wild-rice-Pangenome-Project/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/panfamflow"]

[tool.hatch.build]
include = [
  "src/panfamflow/**/*.py",
  "src/panfamflow/templates/*.yaml",
  "src/panfamflow/workflow/Snakefile",
  "src/panfamflow/workflow/rules/*.smk",
  "src/panfamflow/workflow/scripts/*",
  "src/panfamflow/workflow/envs/*.yaml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".snakemake", "results", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/panfamflow/workflow/scripts/*.py" = ["T201"]
"tests/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["panfamflow"]
exclude = ["^src/panfamflow/workflow/"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
