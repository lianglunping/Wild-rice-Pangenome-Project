name: Recover PanFamFlow v0.1.1 source publication

on:
  push:
    branches:
      - feature/panfamflow-v0.1.1-resume
    paths:
      - ".github/workflows/panfamflow-v0.1.1-recover.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panfamflow-v0.1.1-recover
  cancel-in-progress: false

jobs:
  verify-and-publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARCHIVE_FILE_ID: "1p0HUZHr2ckfJB1kwPob_ir2ho46SwIki"
      ARCHIVE_SHA256: "c4d685c5d0c7aa349af2aa1b07ef566f05fbf5d0ae461afe664212dc3af9cbca"
      FEATURE_BRANCH: "feature/panfamflow-v0.1.1-resume"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Materialize project when absent
        run: |
          set -euo pipefail
          if [[ -f PanFamFlow/pyproject.toml ]]; then
            echo "Project already exists; proceeding with re-verification."
            exit 0
          fi
          python3 - <<'PY'
          import hashlib
          import os
          import stat
          import urllib.request
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          root = Path.cwd().resolve()
          file_id = os.environ["ARCHIVE_FILE_ID"]
          expected = os.environ["ARCHIVE_SHA256"]
          archive = Path("/tmp/PanFamFlow-v0.1.1-staging.zip")
          urls = [
              f"https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t",
              f"https://drive.google.com/uc?export=download&id={file_id}&confirm=t",
          ]
          errors: list[str] = []
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "PanFamFlow-recover/0.1.1"})
                  with urllib.request.urlopen(req, timeout=120) as response:
                      payload = response.read()
                  observed = hashlib.sha256(payload).hexdigest()
                  if observed == expected:
                      archive.write_bytes(payload)
                      break
                  errors.append(f"{url}: sha256={observed}, bytes={len(payload)}")
              except Exception as exc:  # noqa: BLE001
                  errors.append(f"{url}: {type(exc).__name__}: {exc}")
          else:
              raise RuntimeError("Verified download failed:\n" + "\n".join(errors))

          with ZipFile(archive) as handle:
              corrupt = handle.testzip()
              if corrupt is not None:
                  raise RuntimeError(f"Corrupt ZIP member: {corrupt}")
              for member in handle.infolist():
                  logical = PurePosixPath(member.filename)
                  if logical.is_absolute() or ".." in logical.parts:
                      raise RuntimeError(f"Unsafe member: {member.filename}")
                  if stat.S_ISLNK(member.external_attr >> 16):
                      raise RuntimeError(f"Symlink is not allowed: {member.filename}")
                  target = (root / member.filename).resolve()
                  if not target.is_relative_to(root):
                      raise RuntimeError(f"Member escapes repository: {member.filename}")
              handle.extractall(root)

          required = [
              root / "PanFamFlow/pyproject.toml",
              root / "PanFamFlow/src/panfamflow/cli.py",
              root / "PanFamFlow/src/panfamflow/runner.py",
              root / "PanFamFlow/src/panfamflow/workflow/Snakefile",
              root / "PanFamFlow/tests",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise RuntimeError(f"Archive missing required files: {missing}")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: "PanFamFlow/uv.lock"

      - name: Locked environment and Python quality gates
        working-directory: PanFamFlow
        run: |
          set -euo pipefail
          uv python install 3.12
          uv lock
          uv sync --locked --dev
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/panfamflow
          uv run pytest -q
          uv build

      - name: CLI and workflow dry-run gates
        working-directory: PanFamFlow
        run: |
          set -euo pipefail
          uv run panfamflow --version
          uv run panfamflow validate -c examples/toy/config.yaml -m qc
          uv run panfamflow plan -c examples/toy/config.yaml -m qc
          uv run pytest -q tests/test_runner.py tests/test_workflow_utils.py
          uv run --with 'snakemake==9.25.1' snakemake \
            --snakefile "${GITHUB_WORKSPACE}/PanFamFlow/src/panfamflow/workflow/Snakefile" \
            --configfile "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy/config.yaml" \
            --directory "${GITHUB_WORKSPACE}/PanFamFlow/examples/toy" \
            --cores 2 \
            --dry-run \
            results/00_qc/qc.done

      - name: Commit verified source
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PanFamFlow
          if git diff --cached --quiet; then
            echo "Verified project is already committed."
            exit 0
          fi
          git commit -m "feat: add PanFamFlow v0.1.1 smart resume"
          git push origin "HEAD:${FEATURE_BRANCH}"
