name: Bootstrap PanFamFlow feature branch

on:
  push:
    branches:
      - feature/panfamflow-v0.1.0
    paths:
      - "_staging/**"
      - ".github/workflows/panfamflow-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode-staging-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Decode staged Base64 streams
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd().resolve()
          output = root / "_diagnostics"
          output.mkdir()
          parts = sorted((root / "_staging").glob("part-*"))
          if not parts:
              raise RuntimeError("No staging parts were found")

          part_texts = [
              "".join(part.read_text(encoding="ascii").split())
              for part in parts
          ]
          encoded = "".join(part_texts)

          ranges: list[tuple[int, int]] = []
          start = 0
          index = 0
          while index < len(encoded):
              if encoded[index] != "=":
                  index += 1
                  continue
              end = index
              while end + 1 < len(encoded) and encoded[end + 1] == "=":
                  end += 1
              ranges.append((start, end + 1))
              start = end + 1
              index = end + 1
          if start < len(encoded):
              ranges.append((start, len(encoded)))

          decoded: list[bytes] = []
          metadata: dict[str, object] = {
              "part_names": [part.name for part in parts],
              "part_lengths": [len(text) for text in part_texts],
              "encoded_total_length": len(encoded),
              "stream_ranges": ranges,
              "streams": [],
          }
          for number, (left, right) in enumerate(ranges, start=1):
              stream = encoded[left:right]
              if len(stream) % 4:
                  stream += "=" * (-len(stream) % 4)
              payload = base64.b64decode(stream, validate=True)
              decoded.append(payload)
              path = output / f"stream-{number:02d}.bin"
              path.write_bytes(payload)
              metadata["streams"].append(
                  {
                      "number": number,
                      "encoded_length": right - left,
                      "decoded_length": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                      "prefix_hex": payload[:64].hex(),
                      "suffix_hex": payload[-64:].hex(),
                      "local_headers": payload.count(b"PK\x03\x04"),
                      "central_headers": payload.count(b"PK\x01\x02"),
                      "eocd_headers": payload.count(b"PK\x05\x06"),
                  }
              )

          combined = b"".join(decoded)
          (output / "combined.bin").write_bytes(combined)
          metadata["combined"] = {
              "decoded_length": len(combined),
              "sha256": hashlib.sha256(combined).hexdigest(),
              "local_headers": combined.count(b"PK\x03\x04"),
              "central_headers": combined.count(b"PK\x01\x02"),
              "eocd_headers": combined.count(b"PK\x05\x06"),
          }
          (output / "metadata.json").write_text(
              json.dumps(metadata, indent=2), encoding="utf-8"
          )
          print(json.dumps(metadata, indent=2))
          PY

      - name: Upload staging diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: panfamflow-staging-diagnostics
          path: _diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Stop after diagnostic snapshot
        run: |
          echo "Diagnostic artifact uploaded; reconstruction will be repaired in the next commit."
          exit 1
